[project]
name = "quantum-demand-forecasting"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.29.0",
    "pennylane>=0.40.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
train = [
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
]

[tool.vercel]
entrypoint = "backend.main:app"

